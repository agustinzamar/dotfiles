# This file is copied into ~/.config/herdr/config.toml during installation

onboarding = false

[theme]
# Match Ghostty's Catppuccin Macchiato palette. Herdr's built-in "catppuccin"
# theme is Mocha, so override the tokens with Macchiato values to match.
name = "catppuccin"

# Don't switch light/dark modes
auto_switch = false

[theme.custom]
accent = "#c6a0f6"
panel_bg = "#24273a"
surface0 = "#363a4f"
surface1 = "#494d64"
surface_dim = "#1e2030"
overlay0 = "#6e738d"
overlay1 = "#8087a2"
text = "#cad3f5"
subtext0 = "#a5adcb"
mauve = "#c6a0f6"
green = "#a6da95"
yellow = "#eed49f"
red = "#ed8796"
blue = "#8aadf4"
teal = "#8bd5ca"
peach = "#f5a97f"

[keys]
# Match tmux/Zellij-style prefix muscle memory.
prefix = "ctrl+a"

# Jump straight to agent N (1..9) as listed in the sidebar.
# Use Ctrl after the prefix: Alt+number is owned by skhd/yabai spaces,
# and Shift+number did not reach Herdr reliably in the current terminal setup.
focus_agent = "prefix+ctrl+1..9"

focus_pane_left = "ctrl+h"
focus_pane_right = "ctrl+l"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"

new_tab = "prefix+t"

# prefix+shift+n is taken by the workspace.layout plugin action below.
new_workspace = "prefix+shift+m"

# prefix+shift+n: new workspace pre-loaded with 4 named tabs.
# Plugin lives in dotfiles/config/herdr/workspace-layout; link with
# herdr plugin link ~/dotfiles/config/herdr/workspace-layout
[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "workspace.layout.create-layout"
description = "new workspace with 4 tabs"

# Clear the focused pane. Ghostty maps cmd+k to the F5 sequence, because a raw
# Ctrl+L byte would be captured here by focus_pane_right instead.
[[keys.command]]
key = "f5"
type = "shell"
command = "/Users/dzamarcoto/dotfiles/config/herdr/clear-focused-pane.sh"
description = "clear focused pane"

# Hyper chord so this does not steal ctrl+t from shells, editors, or Ghostty.
# Toggle-popup plugin keeps the shell alive in a tmux session so the same key opens and closes it.
[[keys.command]]
key = "ctrl+shift+alt+cmd+t"
type = "plugin_action"
command = "maro114510.toggle-popup.toggle-shell"
description = "toggle scratch terminal"

[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true

mouse_capture = true
copy_on_select = true
host_cursor = "native"
right_click_passthrough_modifier = "ctrl"
mouse_scroll_lines = 1

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
position = "top-right"

[ui.sound]
enabled = true

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["state_text", "git_status"],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["state_text", "agent", "tab"]
]

[terminal]
default_shell = "zsh"

[update]
channel = "preview"

[experimental]
kitty_graphics = true

[session]
resume_agents_on_restore = true

[advanced]

# Two more zeros than default
scrollback_limit_bytes=1000000000
