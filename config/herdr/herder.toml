# This file is copied into ~/.config/herdr/config.toml during installation

onboarding = false

[theme]
# Use a built-in dark theme with neutral foregrounds so Herdr does not inherit
# Ghostty bright-black selected rows or Kanagawa's warm/yellow label text.
name = "one-dark"

# Don't switch light/dark modes
auto_switch = false

[keys]
# Match tmux/Zellij-style prefix muscle memory.
prefix = "ctrl+a"

# Jump straight to agent N (1..9) as listed in the sidebar.
# Use Ctrl after the prefix: Alt+number is owned by skhd/yabai spaces,
# and Shift+number did not reach Herdr reliably in the current terminal setup.
focus_agent = "prefix+ctrl+1..9"

focus_pane_left = "ctrl+h"
focus_pane_right = "ctrl+l"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"

new_tab = "prefix+t"

[[keys.command]]
key = "ctrl+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true

mouse_capture = true
copy_on_select = true
host_cursor = "native"
right_click_passthrough_modifier = "ctrl"
mouse_scroll_lines = 1

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
position = "top-right"

[ui.sound]
enabled = true

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["workspace"],
  ["state_text", "git_status"],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["state_text", "agent", "tab"]
]

[terminal]
default_shell = "zsh"

[update]
channel = "preview"

[experimental]
kitty_graphics = true

[session]
resume_agents_on_restore = true

[advanced]

# Two more zeros than default
scrollback_limit_bytes=1000000000
