name: test

on:
  push:
    branches: [main]
  # Unfiltered so that pull requests from working branches are checked too.
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shell tooling
        run: brew install shellcheck shfmt bats-core

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install TUI dependencies
        run: cd tools/tui && bun install --frozen-lockfile

      - name: Check syntax
        run: make check

      - name: Lint
        run: make lint

      - name: Test (shell)
        run: make test

      - name: Test (TypeScript)
        run: cd tools/tui && bun test

      - name: Build smoke (dot-tui)
        run: make build-tui
