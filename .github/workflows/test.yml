name: test

on:
  push:
    branches: [main]
  # Unfiltered so that pull requests from working branches are checked too.
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shell tooling
        run: brew install shellcheck shfmt bats-core

      - name: Check syntax
        run: make check

      - name: Lint
        run: make lint

      - name: Test
        run: bats test
