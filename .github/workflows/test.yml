name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shell tooling
        run: brew install shellcheck shfmt

      - name: Check scripts
        run: |
          bash -n install.sh scripts/*.sh
          shellcheck install.sh scripts/*.sh
          shfmt -d install.sh scripts/*.sh
