name: test

on:
  push:
    branches: [main]
  # Unfiltered so that pull requests from working branches are checked too.
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shell tooling
        run: brew install shellcheck shfmt bats-core

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check syntax
        run: make check

      - name: Lint
        run: make lint

      - name: Test (shell)
        run: bats test

      - name: Test (Go)
        run: make go-test
