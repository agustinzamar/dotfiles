name: test

on:
  push:
    branches: [main]
  # Unfiltered so that pull requests from working branches are checked too.
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install shell tooling (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck shfmt bats-core

      # Lint runs on macOS only, so Linux needs the test runner plus the two
      # interpreters the suite shells out to: zsh for the completion and
      # .zshrc checks, pnpm for the skills CLI assertions.
      - name: Install shell tooling (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats zsh
          npm install --global pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install TUI dependencies
        run: cd tools/tui && bun install --frozen-lockfile

      - name: Check syntax
        run: make check

      # shfmt and shellcheck disagree between apt and brew releases, so a single
      # runner owns the definition of "formatted".
      - name: Lint
        if: runner.os == 'macOS'
        run: make lint

      - name: Test (shell)
        run: make test

      - name: Test (TypeScript)
        run: cd tools/tui && bun test

      - name: Build smoke (dot-tui)
        run: make build-tui
