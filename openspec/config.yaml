# openspec/config.yaml — SDD project configuration for dotfiles
schema: spec-driven

context: |
  Tech stack: Bash CLI (`bin/dot`) + Bun/TS Ink TUI (`tools/tui/`) + Homebrew Bundle.
  Architecture: bash entrypoint CLI drives install/link flows; `install/manifest.sh` is the
  single package manifest parser emitting the versioned installer-context JSON consumed by
  the TUI (`tools/tui/src/`, Bun + Ink; binary built to `bin/dot-tui` by `make build-tui`).
  Bare `dot install` opens the interactive TUI; `--all` / `--profile <name>` stay headless.
  Shell assets in `install/*.sh` and `system/defaults/*.sh`; app configs under `config/`.
  Testing: `bun test` (unit, tools/tui) via `make bun-test`; Bats integration tests over the
  real `dot` CLI via `make test` / CI (`bats test`). CI gates: `make check`, `make lint`.
  Style: shell scripts gated by shellcheck -x + shfmt -d; TS gated by tsc --noEmit; .editorconfig present.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Installer changes MUST state impact on fresh-machine bootstrap (`bin/dot install`)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (bin/dot + install/*.sh layout, tools/tui/src, Makefile targets)
      - Shell changes must pass `make check` and `make lint` before commit
      - TUI changes must pass `cd tools/tui && bun test` before commit
    tdd: true
    test_command: "make check && make lint && make test"
  verify:
    test_command: "make check && make lint && make test"
    build_command: "make build-tui"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  detected: "2026-08-22"
  test_runner:
    unit: "bun test (make bun-test)"
    integration: "bats test/*.bats (make test / dot test)"
  layers:
    unit: { available: true, tool: "bun test" }
    integration: { available: true, tool: "bats-core" }
    e2e: { available: false, tool: "" }
  coverage:
    available: false
    command: ""
    enforced_threshold: none
  quality_tools:
    linter:
      { available: true, command: "shellcheck -x <scripts>" }
    type_checker: { available: true, command: "tsc --noEmit -p tools/tui" }
    formatter: { available: true, command: "shfmt -d <scripts>" }
